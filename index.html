"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a37bb1dd-8eb3-4352-a0e6-68b0ab2c2cb6\"><\u002Fscript>\n<script src=\"3bd211cc-050d-45d3-9e5a-63c2b8aa16d7\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\nhtml,body{margin:0;padding:0;background:#F2F0ED;}\nbody{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}\n*{box-sizing:border-box;}\na{color:#00774C;}\na:hover{color:#004C46;}\ntextarea::placeholder,input::placeholder{color:#6B6560;opacity:1;}\n@media (prefers-reduced-motion: reduce){*{transition:none !important;scroll-behavior:auto !important;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#F2F0ED;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;color:#33302D;display:flex;flex-direction:column;\">\n  <sc-if value=\"{{ showCover }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed;inset:0;z-index:50;background:#003C37;overflow:hidden;\">\n      <div ref=\"{{ coverRef }}\" style=\"position:absolute;left:0;top:0;bottom:0;width:clamp(280px,54%,600px);max-width:100%;background:#004C46;color:#FFFFFF;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:34px clamp(22px,4vw,46px);box-shadow:26px 0 62px rgba(0,44,40,0.44);\">\n        <div aria-hidden=\"true\" data-fold=\"1\" style=\"position:absolute;right:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden;width:min(74%,330px);height:min(58%,290px);\">\n          <span style=\"position:absolute;inset:0;background:#00774C;clip-path:polygon(100% 14%,100% 100%,60% 100%);\"><\u002Fspan>\n          <span style=\"position:absolute;inset:0;background:#003C2E;clip-path:polygon(39% 54%,70% 35%,60% 100%);\"><\u002Fspan>\n          <span style=\"position:absolute;inset:0;background:#7CC24D;clip-path:polygon(47% 42%,100% 14%,60% 100%);\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;\">\n          <h1 data-cover-anim=\"1\" style=\"font-family:Georgia, 'Times New Roman', serif;font-weight:400;font-size:clamp(26px,3.9vw,42px);line-height:1.1;letter-spacing:-0.025em;margin:0;color:#FFFFFF;\">The discovery guide<\u002Fh1>\n          <p data-cover-anim=\"1\" style=\"font-size:clamp(14px,1.5vw,17px);line-height:1.55;color:#DEEADF;max-width:40ch;margin:14px 0 0;text-wrap:pretty;\">Use what you know about the Rileys to fill in a real discovery guide, area by area, then download your finished copy.<\u002Fp>\n          <button data-cover-anim=\"1\" sc-camel-on-click=\"{{ startCover }}\" style=\"appearance:none;display:inline-flex;align-items:center;gap:9px;min-height:48px;margin-top:26px;padding:12px 22px;border-radius:999px;border:1px solid #B8D87A;background:#7CC24D;color:#00352F;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:600;line-height:1.2;cursor:pointer;box-shadow:0 10px 26px rgba(0,44,40,0.34);transition:background 200ms, transform 200ms;\" style-hover=\"background:#B8D87A;transform:translateY(-1px);\" style-focus=\"outline:3px solid #B8D87A;outline-offset:3px;\">\n            <span style=\"white-space:nowrap;\">{{ coverLabel }}<\u002Fspan>\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ notCover }}\" hint-placeholder-val=\"{{ false }}\">\n\n  <header ref=\"{{ topRef }}\" style=\"background:#FFFFFF;border-bottom:1px solid #E4E1DC;\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:14px clamp(16px,4vw,40px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#00774C;\">Walkthrough<\u002Fdiv>\n        <div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:700;color:#004C46;line-height:1.3;\">The discovery guide<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;flex:0 1 auto;justify-content:flex-end;\">\n        <div style=\"font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#5A5A5A;white-space:nowrap;font-variant-numeric:tabular-nums;\">{{ stepLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex:1;width:100%;max-width:1160px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(12px,4vw,40px) 24px;\">\n    <div style=\"position:relative;background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(40,30,20,0.06),0 8px 32px rgba(40,30,20,0.06);\">\n\n      <sc-if value=\"{{ showTracker }}\" hint-placeholder-val=\"{{ false }}\">\n        <nav aria-label=\"Progress\" style=\"position:relative;z-index:2;padding:clamp(16px,3vw,24px) clamp(18px,4vw,48px) 0;display:flex;flex-wrap:wrap;gap:12px clamp(20px,4vw,40px);\">\n          <sc-for list=\"{{ trackerParts }}\" as=\"part\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0;\">\n              <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;\">\n                <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#33302D;\">{{ part.name }}<\u002Fspan>\n                <span style=\"font-size:12.5px;color:#5A5A5A;font-variant-numeric:tabular-nums;\">{{ part.countText }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:2px;margin-left:-8px;\">\n                <sc-for list=\"{{ part.dots }}\" as=\"d\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ d.go }}\" aria-label=\"{{ d.label }}\" title=\"{{ d.title }}\" aria-current=\"{{ d.current }}\" aria-disabled=\"{{ d.locked }}\" style=\"appearance:none;border:none;background:none;padding:0;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:{{ d.cursor }};\">\n                    <span aria-hidden=\"true\" style=\"width:12px;height:12px;border-radius:50%;background:{{ d.bg }};border:2px solid {{ d.border }};box-shadow:{{ d.ring }};transition:background 250ms, border-color 250ms, box-shadow 250ms;\"><\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Fsc-if>\n      <div ref=\"{{ contentRef }}\" style=\"position:relative;z-index:1;\">\n\n        <sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#004C46;color:#FFFFFF;padding:clamp(28px,5vw,64px) clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:18px;\">\n            <div data-anim=\"1\" style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#B8D87A;\">Walkthrough<\u002Fdiv>\n            <h1 data-anim=\"1\" style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:400;font-size:clamp(26px,3.9vw,42px);line-height:1.1;letter-spacing:-0.025em;\">The discovery guide<\u002Fh1>\n            <p data-anim=\"1\" style=\"margin:0;max-width:640px;font-size:clamp(14px,1.5vw,17px);line-height:1.55;color:#E4E1DC;text-wrap:pretty;\">Six areas to cover in a customer conversation, and somewhere to write down what you hear.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding:clamp(24px,4vw,48px) clamp(20px,5vw,64px) clamp(80px,9vw,120px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,4vw,48px);align-items:start;\">\n            <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;\">\n              <div style=\"background:#00774C;color:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;\">AREA 1<\u002Fdiv><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;\">Goals and motivations<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#0071CE;color:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;\">AREA 2<\u002Fdiv><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;\">Household and people<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#FF9016;color:#3C1A52;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;\">AREA 3<\u002Fdiv><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;\">Home and site<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#742E89;color:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;\">AREA 4<\u002Fdiv><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;\">Energy use and bills<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#AB0033;color:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;\">AREA 5<\u002Fdiv><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;\">Budget and timeframe<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#1226AA;color:#FFFFFF;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:92px;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;\">AREA 6<\u002Fdiv><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;\">Preferences<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(24px,5vw,56px) clamp(20px,5vw,64px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:clamp(28px,4vw,44px);\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(20px,4vw,56px);align-items:start;\">\n              <h2 data-anim=\"1\" style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#004C46;\">How to use this<\u002Fh2>\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.65;text-wrap:pretty;grid-column:span 2;min-width:0;\">\n                <p style=\"margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:17px;line-height:1.5;color:#004C46;\">Ask like a conversation. Record like a form. The questions you say out loud are open. The structure you are holding, and writing into, is the six areas. The customer experiences a conversation and you leave with a complete record.<\u002Fp>\n                <p style=\"margin:0;\">The six areas are not in a fixed order, because a real conversation will not go in one. What matters is that you leave knowing which areas you covered and which you did not.<\u002Fp>\n                <p style=\"margin:0;\">Write down what they said, not what you concluded. “We’ve stopped using two rooms” is worth more in eighteen months than “heating inadequate”, because it says what good would look like to them.<\u002Fp>\n                <p style=\"margin:0;\">Record as you go. It is not rude if you say what you are doing: “I’m just writing this down so I don’t make you repeat it.”<\u002Fp>\n                <p style=\"margin:0;\">A gap is a finding. If you did not get to something, say so. If they did not know, that is worth knowing. If they would rather not say, record it neutrally and do not chase it. Never fill a blank with something plausible.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:16px;\">\n              <h2 data-anim=\"1\" style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#004C46;\">Three things before you start<\u002Fh2>\n              <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;\">\n                <div style=\"background:#E5F3D6;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;\">\n                  <div style=\"width:32px;height:32px;border-radius:50%;background:#00774C;color:#FFFFFF;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;\">1<\u002Fdiv>\n                  <div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;color:#004C46;\">Say why you’re asking<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;\">Half a sentence is enough, and only for the questions that would otherwise sound intrusive. If you can’t say why you’re asking, you’ve found a question you don’t need.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#DDF0FA;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;\">\n                  <div style=\"width:32px;height:32px;border-radius:50%;background:#0071CE;color:#FFFFFF;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;\">2<\u002Fdiv>\n                  <div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;color:#0F206C;\">Ask one at a time<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;\">A stacked question gets one answer, and it will be to whichever part was easiest. Resist explaining the question before they’ve answered it.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#F6E3EF;border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;\">\n                  <div style=\"width:32px;height:32px;border-radius:50%;background:#742E89;color:#FFFFFF;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;\">3<\u002Fdiv>\n                  <div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.3;color:#3C1A52;\">“I don’t know yet” is an answer<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;\">“That depends on your tariff and I’d want to see a bill” is better than a confident guess. Customers can tell the difference more often than people expect.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"background:#FFF6E0;border-radius:16px;padding:22px 24px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;\">\n              <div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;color:#8A2432;flex:0 0 auto;\">One thing this guide does not do<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.6;flex:1 1 320px;\">It does not design, size, quote or advise. Where the conversation needs a licensed or specialist opinion, flagging it is the whole of your job. There is a place to flag it later in this guide.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isA1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;\">\n              <div style=\"background:#00774C;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AREA 1<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#004C46;\">Goals and motivations<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,32px);align-items:start;\">\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#00774C;\">What you’d say<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#004C46;\">\n                  <p style=\"margin:0;\">“What’s got you thinking about changing things at home?”<\u002Fp>\n                  <p style=\"margin:0;\">“What would you most like to improve?”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"background:#FFF6E0;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Thin answer?<\u002Fstrong> “Just looking really.” <strong style=\"color:#8A2432;\">Try:<\u002Fstrong> “Fair enough. Was there something that got you started, such as a bill, or something playing up?”<\u002Fdiv>\n                <div style=\"border-top:1px solid #E4E1DC;padding-top:14px;font-size:15px;line-height:1.6;\"><strong style=\"color:#00774C;\">What it changes:<\u002Fstrong> Everything downstream. Comfort and cost lead to different plans.<\u002Fdiv>\n              <\u002Fdiv>\n              <div data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#00774C;\">What you write down<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5A5A5A;\">What you already know<\u002Fdiv>\n                  <div style=\"background:#FFFFFF;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:#4A4A4A;\">{{ prefill1 }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#00774C;\">To complete<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:#33302D;text-wrap:pretty;\">what they'd most like to improve, and which of cost, comfort and getting off gas matters most.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ fields1 }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <span style=\"font-size:15px;font-weight:700;line-height:1.4;color:#00774C;\">{{ fd.label }}<\u002Fspan>\n                    <textarea aria-required=\"true\" aria-invalid=\"{{ fd.invalid }}\" data-key=\"{{ fd.key }}\" value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ onAreaField }}\" rows=\"3\" placeholder=\"Write down what they said, not what you concluded.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid {{ fd.border }};border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#00774C;box-shadow:0 0 0 3px rgba(0,119,76,0.18);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isA2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;\">\n              <div style=\"background:#0071CE;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AREA 2<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#0F206C;\">Household and people<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,32px);align-items:start;\">\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0071CE;\">What you’d say<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#0F206C;\">\n                  <p style=\"margin:0;\">“Can you tell me about the house and how you use it?”<\u002Fp>\n                  <p style=\"margin:0;\">“Is anything changing in the next few years?”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"background:#FFF6E0;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Thin answer?<\u002Fstrong> “It’s just a normal house.” <strong style=\"color:#8A2432;\">Try:<\u002Fstrong> “Walk me through a weekday. Who’s home, and which rooms do you actually use?”<\u002Fdiv>\n                <div style=\"background:#F2F0ED;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#0F206C;\">Why you’re asking.<\u002Fstrong> Who’s home during the day? “It changes when the house uses power, which changes whether solar helps you.”<\u002Fdiv>\n                <div style=\"border-top:1px solid #E4E1DC;padding-top:14px;font-size:15px;line-height:1.6;\"><strong style=\"color:#0071CE;\">What it changes:<\u002Fstrong> Understanding household demand and timing, which can inform later assessment and design. What is coming changes what is worth spending now.<\u002Fdiv>\n              <\u002Fdiv>\n              <div data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0071CE;\">What you write down<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5A5A5A;\">What you already know<\u002Fdiv>\n                  <div style=\"background:#FFFFFF;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:#4A4A4A;\">{{ prefill2 }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0071CE;\">To complete<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:#33302D;text-wrap:pretty;\">who's home during the day, which rooms are used, and what's changing. The second bathroom belongs here.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ fields2 }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <span style=\"font-size:15px;font-weight:700;line-height:1.4;color:#0071CE;\">{{ fd.label }}<\u002Fspan>\n                    <textarea aria-required=\"true\" aria-invalid=\"{{ fd.invalid }}\" data-key=\"{{ fd.key }}\" value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ onAreaField }}\" rows=\"3\" placeholder=\"Write down what they said, not what you concluded.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid {{ fd.border }};border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#0F206C;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#0071CE;box-shadow:0 0 0 3px rgba(0,113,206,0.18);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isA3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;\">\n              <div style=\"background:#FF9016;color:#3C1A52;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AREA 3<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#8A2432;\">Home and site<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,32px);align-items:start;\">\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B04A00;\">What you’d say<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#8A2432;\">\n                  <p style=\"margin:0;\">“How old is the place, and has anything been done to it?”<\u002Fp>\n                  <p style=\"margin:0;\">“Do you already have solar, a battery, an EV charger, electric hot water, air conditioning or induction cooking?”<\u002Fp>\n                  <p style=\"margin:0;\">“Has an electrician or other tradesperson ever told you there are limitations, faults or work needed before you add anything?”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"background:#FFF6E0;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Thin answer?<\u002Fstrong> “It’s fine.” <strong style=\"color:#8A2432;\">Try:<\u002Fstrong> “Is there anything about it that annoys you? Most people have something.”<\u002Fdiv>\n                <div style=\"background:#F2F0ED;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Why you’re asking.<\u002Fstrong> How old is the switchboard? “The age and condition of the switchboard can be useful information, but an electrician needs to assess whether it is suitable for any proposed electrical changes.”<\u002Fdiv>\n                <div style=\"border-top:1px solid #E4E1DC;padding-top:14px;font-size:15px;line-height:1.6;\"><strong style=\"color:#B04A00;\">What it changes:<\u002Fstrong> What may need to be checked, and what it could cost to get there. This is where the surprises live.<\u002Fdiv>\n              <\u002Fdiv>\n              <div data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B04A00;\">What you write down<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5A5A5A;\">What you already know<\u002Fdiv>\n                  <div style=\"background:#FFFFFF;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:#4A4A4A;\">{{ prefill3 }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B04A00;\">To complete<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:#33302D;text-wrap:pretty;\">insulation, roof, where an outdoor unit could go, and the age of the switchboard.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ fields3 }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <span style=\"font-size:15px;font-weight:700;line-height:1.4;color:#B04A00;\">{{ fd.label }}<\u002Fspan>\n                    <textarea aria-required=\"true\" aria-invalid=\"{{ fd.invalid }}\" data-key=\"{{ fd.key }}\" value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ onAreaField }}\" rows=\"3\" placeholder=\"Write down what they said, not what you concluded.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid {{ fd.border }};border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#8A2432;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#FF9016;box-shadow:0 0 0 3px rgba(255,144,22,0.25);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isA4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;\">\n              <div style=\"background:#742E89;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AREA 4<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#3C1A52;\">Energy use and bills<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,32px);align-items:start;\">\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#742E89;\">What you’d say<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#3C1A52;\">\n                  <p style=\"margin:0;\">“Would you be able to dig out a recent bill? It tells me things I’d otherwise be guessing at.”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"background:#F6E3EF;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#3C1A52;\">What you are after:<\u002Fstrong> what they pay, what tariff they are on, and when the house uses most, whether they have solar, battery storage or controlled-load arrangements, and what they know about their current export or supply arrangements. Not knowing is itself worth writing down.<\u002Fdiv>\n                <div style=\"background:#F2F0ED;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#3C1A52;\">Why you’re asking.<\u002Fstrong> Can I see a recent bill? “It tells me things I’d otherwise be guessing at.”<\u002Fdiv>\n                <div style=\"border-top:1px solid #E4E1DC;padding-top:14px;font-size:15px;line-height:1.6;\"><strong style=\"color:#742E89;\">What it changes:<\u002Fstrong> The information available for assessing potential energy costs and savings. Without it, any estimate needs more assumptions.<\u002Fdiv>\n              <\u002Fdiv>\n              <div data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#742E89;\">What you write down<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#742E89;\">To complete<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:#33302D;text-wrap:pretty;\">what they pay, what tariff they're on, and when the house uses most. All three unknown.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ fields4 }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <span style=\"font-size:15px;font-weight:700;line-height:1.4;color:#742E89;\">{{ fd.label }}<\u002Fspan>\n                    <textarea aria-required=\"true\" aria-invalid=\"{{ fd.invalid }}\" data-key=\"{{ fd.key }}\" value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ onAreaField }}\" rows=\"3\" placeholder=\"Write down what they said, not what you concluded.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid {{ fd.border }};border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#3C1A52;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#742E89;box-shadow:0 0 0 3px rgba(116,46,137,0.18);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isA5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;\">\n              <div style=\"background:#AB0033;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AREA 5<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#8A2432;\">Budget and timeframe<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,32px);align-items:start;\">\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#AB0033;\">What you’d say<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#8A2432;\">\n                  <p style=\"margin:0;\">“Do you have a budget or a timeframe in mind, or are you still working that out?”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"background:#FFF6E0;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Thin answer?<\u002Fstrong> “Not really sure yet.” That is a real answer. Write it down rather than leaving the space blank.<\u002Fdiv>\n                <div style=\"background:#F2F0ED;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Why you’re asking.<\u002Fstrong> What’s your budget? “So I don’t waste your time on things that aren’t in the ballpark.”<\u002Fdiv>\n                <div style=\"border-top:1px solid #E4E1DC;padding-top:14px;font-size:15px;line-height:1.6;\"><strong style=\"color:#AB0033;\">What it changes:<\u002Fstrong> What is realistic, and in what order. A plan they can start beats a complete one they can’t.<\u002Fdiv>\n              <\u002Fdiv>\n              <div data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#AB0033;\">What you write down<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#AB0033;\">To complete<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:#33302D;text-wrap:pretty;\">nothing known. Note that not knowing yet is itself an answer worth writing down.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ fields5 }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <span style=\"font-size:15px;font-weight:700;line-height:1.4;color:#AB0033;\">{{ fd.label }}<\u002Fspan>\n                    <textarea aria-required=\"true\" aria-invalid=\"{{ fd.invalid }}\" data-key=\"{{ fd.key }}\" value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ onAreaField }}\" rows=\"3\" placeholder=\"Write down what they said, not what you concluded.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid {{ fd.border }};border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#8A2432;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#AB0033;box-shadow:0 0 0 3px rgba(171,0,51,0.16);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isA6 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(88px,10vw,128px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;\">\n              <div style=\"background:#1226AA;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AREA 6<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#0F206C;\">Preferences<\u002Fh2>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(16px,3vw,32px);align-items:start;\">\n              <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1226AA;\">What you’d say<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#0F206C;\">\n                  <p style=\"margin:0;\">“If we look at some options, what’ll matter most to you: keeping the upfront cost down, saving over time, comfort, keeping it simple?”<\u002Fp>\n                  <p style=\"margin:0;\">“Is there anything you’re unsure about, or would like us to check before recommending anything?”<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"background:#FFF6E0;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#8A2432;\">Thin answer?<\u002Fstrong> “The cheapest, obviously.” <strong style=\"color:#8A2432;\">Try:<\u002Fstrong> “Cheapest to buy, or cheapest to run? They’re often not the same thing.”<\u002Fdiv>\n                <div style=\"background:#F2F0ED;border-radius:14px;padding:16px 18px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;\"><strong style=\"color:#0F206C;\">Why you’re asking.<\u002Fstrong> Is there anything you’d like us to check first? “People usually know something about their own house that I wouldn’t spot.”<\u002Fdiv>\n                <div style=\"border-top:1px solid #E4E1DC;padding-top:14px;font-size:15px;line-height:1.6;\"><strong style=\"color:#1226AA;\">What it changes:<\u002Fstrong> Which of two similar options they’ll actually be happy with. Most often skipped, most often explains a refusal.<\u002Fdiv>\n              <\u002Fdiv>\n              <div data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n                <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1226AA;\">What you write down<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1226AA;\">To complete<\u002Fdiv>\n                  <div style=\"font-size:15px;line-height:1.6;color:#33302D;text-wrap:pretty;\">nothing known. This is the area the supplier in the hook never reached.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ fields6 }}\" as=\"fd\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\">\n                    <span style=\"font-size:15px;font-weight:700;line-height:1.4;color:#1226AA;\">{{ fd.label }}<\u002Fspan>\n                    <textarea aria-required=\"true\" aria-invalid=\"{{ fd.invalid }}\" data-key=\"{{ fd.key }}\" value=\"{{ fd.value }}\" sc-camel-on-change=\"{{ onAreaField }}\" rows=\"3\" placeholder=\"Write down what they said, not what you concluded.\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid {{ fd.border }};border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#0F206C;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#1226AA;box-shadow:0 0 0 3px rgba(18,38,170,0.16);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(48px,6vw,72px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;max-width:760px;\">\n              <div style=\"align-self:flex-start;background:#004C46;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AFTER THE CONVERSATION<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#004C46;\">What I heard<\u002Fh2>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty;\">A short summary in their terms, written while it is fresh. The test: could the next person reconstruct the conversation from this?<\u002Fp>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;\">\n              <label style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#004C46;\">What they’re actually trying to achieve<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">Their main goal, and which of it matters most.<\u002Fspan>\n                <textarea aria-required=\"true\" data-field=\"heard1\" value=\"{{ heard1 }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#004C46;box-shadow:0 0 0 3px rgba(0,76,70,0.16);\"><\u002Ftextarea>\n              <\u002Flabel>\n              <label style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#004C46;\">What they have now, and how it’s working<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">Including anything they told me they’re unhappy with.<\u002Fspan>\n                <textarea aria-required=\"true\" data-field=\"heard2\" value=\"{{ heard2 }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#004C46;box-shadow:0 0 0 3px rgba(0,76,70,0.16);\"><\u002Ftextarea>\n              <\u002Flabel>\n              <label style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#004C46;\">What matters most to them when they decide<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">Cost now, cost over time, comfort, disruption, sustainability, keeping it simple.<\u002Fspan>\n                <textarea aria-required=\"true\" data-field=\"heard3\" value=\"{{ heard3 }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#004C46;box-shadow:0 0 0 3px rgba(0,76,70,0.16);\"><\u002Ftextarea>\n              <\u002Flabel>\n              <label style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n                <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#004C46;\">Anything I noticed but couldn’t act on<\u002Fspan>\n                <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">A comment about the switchboard, a plan to sell, a room nobody heats. Write it in even if it wasn’t your job.<\u002Fspan>\n                <textarea aria-required=\"true\" data-field=\"heard4\" value=\"{{ heard4 }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#004C46;box-shadow:0 0 0 3px rgba(0,76,70,0.16);\"><\u002Ftextarea>\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(48px,6vw,72px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;max-width:760px;\">\n              <div style=\"align-self:flex-start;background:#B43393;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AFTER THE CONVERSATION<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#3C1A52;\">What I still need to find out<\u002Fh2>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty;\">This section is not optional. If it is empty, you either had an unusually good conversation or you have not looked hard enough. Mark each gap with which kind it is.<\u002Fp>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;\">\n              <sc-for list=\"{{ gapRows }}\" as=\"row\" hint-placeholder-count=\"1\">\n                <div style=\"position:relative;background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 24px;align-items:start;\">\n                  <sc-if value=\"{{ row.canDelete }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ row.remove }}\" aria-label=\"Delete this item\" title=\"Delete this item\" style=\"appearance:none;position:absolute;top:6px;right:6px;width:44px;height:44px;border-radius:50%;border:1.5px solid #D7D2CB;background:#FFFFFF;color:#5A5A5A;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color 180ms, color 180ms;\" style-hover=\"border-color:#AB0033;color:#AB0033;\">×<\u002Fbutton>\n                  <\u002Fsc-if>\n                  <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0;\">\n                    <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B43393;\">{{ row.title }}<\u002Fspan>\n                    <textarea aria-required=\"true\" data-gap=\"{{ row.idx }}\" value=\"{{ row.text }}\" sc-camel-on-change=\"{{ onGap }}\" rows=\"2\" style=\"width:100%;min-height:72px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#3C1A52;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#B43393;box-shadow:0 0 0 3px rgba(180,51,147,0.16);\"><\u002Ftextarea>\n                  <\u002Flabel>\n                  <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0;\">\n                    <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#B43393;\">Which kind of gap<\u002Fspan>\n                    <div role=\"radiogroup\" aria-label=\"{{ row.groupLabel }}\" style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n                      <sc-for list=\"{{ row.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                        <button role=\"radio\" aria-checked=\"{{ o.checked }}\" sc-camel-on-click=\"{{ o.pick }}\" style=\"appearance:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid {{ o.border }};background:{{ o.bg }};color:#33302D;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;transition:background 180ms, border-color 180ms;\">\n                          <span aria-hidden=\"true\" style=\"width:16px;height:16px;border-radius:50%;border:2px solid #B43393;background:{{ o.dot }};flex:0 0 auto;transition:background 180ms;\"><\u002Fspan>\n                          <span>{{ o.label }}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ addGap }}\" style=\"appearance:none;align-self:flex-start;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 20px 0 8px;border-radius:999px;border:1.5px dashed #B43393;background:#FFFFFF;color:#B43393;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;transition:background 180ms;\" style-hover=\"background:#F6E3EF;\">\n                <span style=\"width:32px;height:32px;border-radius:50%;background:#B43393;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;line-height:1;\">+<\u002Fspan>\n                <span>Add another item<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(48px,6vw,72px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;max-width:760px;\">\n              <div style=\"align-self:flex-start;background:#0071CE;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AFTER THE CONVERSATION<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#0F206C;\">Does someone else need to be involved?<\u002Fh2>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty;\">Where technical, regulatory, design or advice requirements sit outside your role, flag it here and refer. Flagging it is the job, not a failure.<\u002Fp>\n            <\u002Fdiv>\n            <div data-anim=\"1\" role=\"group\" aria-label=\"Who needs to be involved\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px;\">\n              <sc-for list=\"{{ refList }}\" as=\"r\" hint-placeholder-count=\"9\">\n                <button aria-pressed=\"{{ r.pressed }}\" sc-camel-on-click=\"{{ r.toggle }}\" style=\"appearance:none;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border-radius:14px;border:1.5px solid {{ r.border }};background:{{ r.bg }};color:#33302D;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;line-height:1.3;transition:background 180ms, border-color 180ms;\">\n                  <span aria-hidden=\"true\" style=\"width:22px;height:22px;border-radius:6px;border:2px solid #0071CE;background:{{ r.box }};color:#FFFFFF;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:background 180ms;\">{{ r.mark }}<\u002Fspan>\n                  <span>{{ r.label }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ otherOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <label style=\"display:flex;flex-direction:column;gap:6px;max-width:520px;\">\n                <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0071CE;\">Other<\u002Fspan>\n                <input data-field=\"refOther\" value=\"{{ refOther }}\" sc-camel-on-change=\"{{ onField }}\" type=\"text\" style=\"width:100%;min-height:48px;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;color:#0F206C;background:#FFFFFF;outline:none;\" style-focus=\"border-color:#0071CE;box-shadow:0 0 0 3px rgba(0,113,206,0.18);\">\n              <\u002Flabel>\n            <\u002Fsc-if>\n            <label data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n              <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#0F206C;\">What I’ll hand over, and what I’ll say while doing it<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">Name who, and why them specifically. Say who rings whom, roughly when, and what to do if nothing happens.<\u002Fspan>\n              <textarea aria-required=\"true\" data-field=\"handover\" value=\"{{ handover }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#0F206C;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#0071CE;box-shadow:0 0 0 3px rgba(0,113,206,0.18);\"><\u002Ftextarea>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS4 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(48px,6vw,72px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;max-width:760px;\">\n              <div style=\"align-self:flex-start;background:#00774C;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AFTER THE CONVERSATION<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#004C46;\">Agreed next step<\u002Fh2>\n              <p style=\"margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.5;color:#00774C;\">“So, based on what we’ve talked about, the next step is…”<\u002Fp>\n            <\u002Fdiv>\n            <label data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n              <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#004C46;\">Agreed with the customer<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">One thing, small enough to actually happen, with who does it and roughly when.<\u002Fspan>\n              <textarea aria-required=\"true\" data-field=\"agreed\" value=\"{{ agreed }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;transition:border-color 200ms, box-shadow 200ms;\" style-focus=\"border-color:#00774C;box-shadow:0 0 0 3px rgba(0,119,76,0.18);\"><\u002Ftextarea>\n            <\u002Flabel>\n            <div data-anim=\"1\" style=\"background:#FFF6E0;border-radius:16px;padding:18px 22px;font-size:clamp(14.5px, 13.5px + 0.3vw, 15px);line-height:1.6;text-wrap:pretty;\">This guide holds personal information about a household. It is covered by whatever privacy and records rules your workplace runs on. The guide travels with the household, not with you.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isS5 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(22px,4vw,48px) clamp(18px,4vw,48px) clamp(48px,6vw,72px);display:flex;flex-direction:column;gap:24px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;max-width:760px;\">\n              <div style=\"align-self:flex-start;background:#3C1A52;color:#FFFFFF;font-size:12px;font-weight:600;letter-spacing:0.14em;padding:6px 12px;border-radius:999px;white-space:nowrap;flex:none;\">AFTER THE CONVERSATION<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#3C1A52;\">Now, next, later<\u002Fh2>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty;\">A pathway, not a quote and not a design. Three columns, no dates. Later means later, and for most households the timing is set by something that hasn’t happened yet.<\u002Fp>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px 24px;font-size:15px;line-height:1.5;\">\n              <div><strong style=\"color:#3C1A52;\">What<\u002Fstrong> · The upgrade or the job, in plain words.<\u002Fdiv>\n              <div><strong style=\"color:#3C1A52;\">Why it fits them<\u002Fstrong> · In their terms, not why the technology is good. This is the part they will still have in two years.<\u002Fdiv>\n              <div><strong style=\"color:#3C1A52;\">Next action<\u002Fstrong> · Small enough to actually happen. “Nothing yet” is a complete answer in the later column.<\u002Fdiv>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px;\">\n              <div style=\"border:1px solid #E4E1DC;border-radius:16px;overflow:hidden;background:#F7F6F3;display:flex;flex-direction:column;\">\n                <div style=\"background:#00774C;color:#FFFFFF;padding:14px 18px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:20px;\">Now<\u002Fspan><span style=\"font-size:14px;color:#E5F3D6;\">This year, or as soon as they can<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:14px;\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#00774C;\">What<\u002Fspan><textarea aria-required=\"true\" data-field=\"nowWhat\" value=\"{{ nowWhat }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#004C46;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;\" style-focus=\"border-color:#00774C;box-shadow:0 0 0 3px rgba(0,119,76,0.18);\"><\u002Ftextarea><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#00774C;\">Why it fits them<\u002Fspan><textarea aria-required=\"true\" data-field=\"nowWhy\" value=\"{{ nowWhy }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\
