font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#0071CE;\">Next action<\u002Fspan><textarea aria-required=\"true\" data-field=\"nextAction\" value=\"{{ nextAction }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#0F206C;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;\" style-focus=\"border-color:#0071CE;box-shadow:0 0 0 3px rgba(0,113,206,0.18);\"><\u002Ftextarea><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid #E4E1DC;border-radius:16px;overflow:hidden;background:#F7F6F3;display:flex;flex-direction:column;\">\n                <div style=\"background:#742E89;color:#FFFFFF;padding:14px 18px;display:flex;flex-direction:column;gap:2px;\"><span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:20px;\">Later<\u002Fspan><span style=\"font-size:14px;color:#F6E3EF;\">When a trigger arrives<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:14px;\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#742E89;\">What<\u002Fspan><textarea aria-required=\"true\" data-field=\"laterWhat\" value=\"{{ laterWhat }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#3C1A52;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;\" style-focus=\"border-color:#742E89;box-shadow:0 0 0 3px rgba(116,46,137,0.18);\"><\u002Ftextarea><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#742E89;\">Why it fits them<\u002Fspan><textarea aria-required=\"true\" data-field=\"laterWhy\" value=\"{{ laterWhy }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"4\" style=\"width:100%;min-height:136px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#3C1A52;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;\" style-focus=\"border-color:#742E89;box-shadow:0 0 0 3px rgba(116,46,137,0.18);\"><\u002Ftextarea><\u002Flabel>\n                  <label style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#742E89;\">Next action<\u002Fspan><textarea aria-required=\"true\" data-field=\"laterAction\" value=\"{{ laterAction }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#3C1A52;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;\" style-focus=\"border-color:#742E89;box-shadow:0 0 0 3px rgba(116,46,137,0.18);\"><\u002Ftextarea><\u002Flabel>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;\">\n              <div style=\"background:#F2F0ED;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;color:#3C1A52;\">Three things make this a pathway rather than a shopping list<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\">Each column says why it fits this household. Each has a next action small enough to happen. And the last column is allowed to say nothing yet, which is a real answer.<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#FFF6E0;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;\"><div style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;color:#8A2432;\">What isn’t on this page<\u002Fdiv><div style=\"font-size:15px;line-height:1.6;\">A price. There are no numbers on it at all, and the plan is still completely usable. If the energy use and bills section is empty, you can still build the pathway. You just can’t say anything about what it saves.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <label data-anim=\"1\" style=\"background:#F7F6F3;border:1px solid #E4E1DC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;\">\n              <span style=\"font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:700;font-size:15px;line-height:1.35;color:#3C1A52;\">What would change this plan<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.5;color:#5A5A5A;\">A trigger the household will recognise when it arrives: a unit failing, a renovation starting, a change at home.<\u002Fspan>\n              <textarea aria-required=\"true\" data-field=\"trigger\" value=\"{{ trigger }}\" sc-camel-on-change=\"{{ onField }}\" rows=\"3\" style=\"width:100%;min-height:104px;resize:vertical;border:1px solid #8A847D;border-radius:10px;padding:0 14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:32px;color:#3C1A52;background-color:#FFFFFF;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#E4E1DC 31px,#E4E1DC 32px);background-attachment:local;outline:none;\" style-focus=\"border-color:#3C1A52;box-shadow:0 0 0 3px rgba(60,26,82,0.16);\"><\u002Ftextarea>\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(28px,5vw,64px) clamp(20px,5vw,64px) clamp(96px,11vw,140px);display:flex;flex-direction:column;gap:28px;\">\n            <div data-anim=\"1\" style=\"display:flex;flex-direction:column;gap:12px;max-width:640px;\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#00774C;\">Every section done<\u002Fdiv>\n              <h2 style=\"margin:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.2;letter-spacing:-0.01em;color:#004C46;\">Your discovery guide is complete<\u002Fh2>\n              <p style=\"margin:0;font-size:15px;line-height:1.6;text-wrap:pretty;\">Download it as a Word document. The completed copy has your notes filled in. The blank copy is for your own customer conversations.<\u002Fp>\n            <\u002Fdiv>\n            <div data-anim=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;max-width:760px;\">\n              <button sc-camel-on-click=\"{{ downloadCompleted }}\" style=\"appearance:none;border:none;cursor:pointer;text-align:left;background:#004C46;color:#FFFFFF;border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;transition:transform 180ms ease, background 180ms ease;\" style-hover=\"background:#00774C;transform:translateY(-2px);\">\n                <div aria-hidden=\"true\" style=\"width:44px;height:52px;flex:0 0 auto;background:#FFFFFF;border-radius:4px;clip-path:polygon(0 0,70% 0,100% 24%,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;color:#004C46;font-size:10px;font-weight:700;\">DOCX<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:3px;\"><span style=\"font-size:15px;font-weight:700;\">{{ completedLabel }}<\u002Fspan><span style=\"font-size:14px;color:#B8D87A;\">With your notes<\u002Fspan><\u002Fdiv>\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ downloadBlank }}\" style=\"appearance:none;border:1.5px solid #D7D2CB;cursor:pointer;text-align:left;background:#FFFFFF;color:#004C46;border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;transition:transform 180ms ease, border-color 180ms ease;\" style-hover=\"border-color:#004C46;transform:translateY(-2px);\">\n                <div aria-hidden=\"true\" style=\"width:44px;height:52px;flex:0 0 auto;background:#F2F0ED;border-radius:4px;clip-path:polygon(0 0,70% 0,100% 24%,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;color:#004C46;font-size:10px;font-weight:700;\">DOCX<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:3px;\"><span style=\"font-size:15px;font-weight:700;\">{{ blankLabel }}<\u002Fspan><span style=\"font-size:14px;color:#5A5A5A;\">For real conversations<\u002Fspan><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\"><div role=\"alert\" style=\"font-size:15px;color:#AB0033;\">{{ errorMsg }}<\u002Fdiv><\u002Fsc-if>\n            <div data-anim=\"1\" style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n              <sc-for list=\"{{ summary }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:8px;background:#F2F0ED;border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:700;color:#33302D;\">\n                  <div style=\"width:22px;height:22px;border-radius:50%;background:{{ s.accent }};color:{{ s.ink }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;\">{{ s.n }}<\u002Fdiv>\n                  <span>{{ s.name }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ restart }}\" style=\"appearance:none;border:none;background:none;padding:0;align-self:flex-start;cursor:pointer;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14px;color:#5A5A5A;text-decoration:underline;text-underline-offset:3px;\" style-hover=\"color:#004C46;\">Clear my notes and start again<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <nav aria-label=\"Walkthrough navigation\" style=\"position:sticky;bottom:0;z-index:5;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border-top:1px solid #E4E1DC;\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:12px clamp(12px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:12px;\">\n      <div style=\"flex:0 0 auto;\">\n        <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ back }}\" style=\"appearance:none;border:1.5px solid #D7D2CB;background:#FFFFFF;color:#33302D;border-radius:999px;min-height:48px;padding:0 22px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;cursor:pointer;transition:border-color 180ms;\" style-hover=\"border-color:#33302D;\">Back<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;min-width:0;\">\n        <div id=\"nav-hint\" aria-live=\"polite\" style=\"font-size:14px;color:#5A5A5A;text-align:right;line-height:1.35;\">{{ hintShown }}<\u002Fdiv>\n        <sc-if value=\"{{ showNext }}\" hint-placeholder-val=\"{{ true }}\">\n          <button aria-describedby=\"nav-hint\" sc-camel-on-click=\"{{ next }}\" style=\"appearance:none;border:none;background:{{ navBg }};color:{{ navInk }};border-radius:999px;min-height:48px;padding:0 28px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:400;cursor:pointer;white-space:nowrap;transition:background 300ms, transform 160ms;\" style-hover=\"transform:translateY(-1px);\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;requireNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;prefill1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pre-filled notes&quot;},&quot;prefill2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pre-filled notes&quot;},&quot;prefill3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pre-filled notes&quot;},&quot;prefill4&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pre-filled notes&quot;},&quot;prefill5&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pre-filled notes&quot;},&quot;prefill6&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pre-filled notes&quot;}}\">\nconst AREAS = [\n  { n: 1, name: 'Goals and motivations', accent: '#00774C', ink: '#FFFFFF', second: '#7CC24D' },\n  { n: 2, name: 'Household and people', accent: '#0071CE', ink: '#FFFFFF', second: '#55C1E9' },\n  { n: 3, name: 'Home and site', accent: '#FF9016', ink: '#3C1A52', second: '#F6B436' },\n  { n: 4, name: 'Energy use and bills', accent: '#742E89', ink: '#FFFFFF', second: '#E2A0C9' },\n  { n: 5, name: 'Budget and timeframe', accent: '#AB0033', ink: '#FFFFFF', second: '#FF4E00' },\n  { n: 6, name: 'Preferences', accent: '#1226AA', ink: '#FFFFFF', second: '#00A8E2' }\n];\nconst KEY = 'tag03-mc1-discovery-guide-walkthrough';\nconst DOCX_URL = 'assets/TAG03_MC1_Discovery_Guide.docx';\nconst DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';\nconst LAST = 13;\nconst FIELDS = {\n  1: ['What they’d most like to improve', 'Which of cost, comfort and getting off gas matters most'],\n  2: ['Who’s home during the day', 'Which rooms are used', 'What’s changing'],\n  3: ['Insulation', 'Roof', 'Where an outdoor unit could go', 'The age of the switchboard'],\n  4: ['What they pay', 'What tariff they’re on', 'When the house uses most'],\n  5: ['Budget', 'Timeframe'],\n  6: ['What’ll matter most to them', 'Anything they’re unsure about, or would like checked']\n};\nconst PREFILL = {\n  1: 'hot water failed and was replaced. Now considering heating. Confused by conflicting information.',\n  2: 'two adults, two school-age children.',\n  3: 'older brick, gas cooktop, one split system in the lounge.'\n};\nconst PREFILL_LABEL = { 1: 'WHAT YOU ALREADY KNOW: ', 2: 'WHAT YOU ALREADY KNOW: ', 3: 'WHAT YOU ALREADY KNOW: ' };\nconst SECTIONS = [\n  { step: 8, name: 'What I heard', accent: '#004C46', ink: '#FFFFFF' },\n  { step: 9, name: 'What I still need to find out', accent: '#B43393', ink: '#FFFFFF' },\n  { step: 10, name: 'Does someone else need to be involved?', accent: '#0071CE', ink: '#FFFFFF' },\n  { step: 11, name: 'Agreed next step', accent: '#00774C', ink: '#FFFFFF' },\n  { step: 12, name: 'Now, next, later', accent: '#3C1A52', ink: '#FFFFFF' }\n];\nconst GAP_KINDS = ['Didn’t get to it', 'They didn’t know', 'They’d rather not say'];\nconst REFS = [\n  { key: 'alew', label: 'Appropriately Licensed Electrical Worker', anchor: 'trical Worker' },\n  { key: 'assessor', label: 'Energy assessor', anchor: 'Energy assessor' },\n  { key: 'solar', label: 'Solar designer', anchor: 'Solar designer' },\n  { key: 'hvac', label: 'HVAC specialist', anchor: 'HVAC specialist' },\n  { key: 'plumber', label: 'Plumber', anchor: 'Plumber' },\n  { key: 'building', label: 'Building or renovation trade', anchor: 'Building or renovation trade' },\n  { key: 'none', label: 'No referral identified', anchor: 'No referral identified' },\n  { key: 'inspector', label: 'Electrical inspector', anchor: 'Electrical inspector' },\n  { key: 'other', label: 'Other', anchor: 'Other: ' }\n];\nconst NNL = ['nowWhat', 'nextWhat', 'laterWhat', 'nowWhy', 'nextWhy', 'laterWhy', 'nowAction', 'nextAction', 'laterAction'];\nconst esc = s => s.replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\nconst runXml = (t, color) => `<w:r><w:rPr><w:rFonts w:ascii=\"Lato\" w:hAnsi=\"Lato\" w:cs=\"Lato\"/><w:color w:val=\"${color}\"/><w:sz w:val=\"20\"/><\u002Fw:rPr><w:t xml:space=\"preserve\">${esc(t)}<\u002Fw:t><\u002Fw:r>`;\nfunction nthTable(xml, anchor, k) {\n  const ai = xml.indexOf(anchor);\n  if (ai < 0) return null;\n  let ts = ai - 7;\n  for (let i = 0; i <= k; i++) { ts = xml.indexOf('<w:tbl>', ts + 7); if (ts < 0) return null; }\n  return [ts, xml.indexOf('<\u002Fw:tbl>', ts)];\n}\nfunction fillLines(xml, anchor, k, text, color) {\n  const lines = (text || '').split(/\\n+/).map(l => l.trim()).filter(Boolean);\n  if (!lines.length) return xml;\n  const r = nthTable(xml, anchor, k);\n  if (!r) return xml;\n  const [ts, te] = r;\n  const inner = xml.slice(ts, te);\n  const rows = inner.match(/<w:tr [\\s\\S]*?<\\/w:tr>/g) || [];\n  if (!rows.length) return xml;\n  const tpl = rows[rows.length - 1].replace(/ w14:(paraId|textId)=\"[^\"]*\"/g, '');\n  const out = [];\n  for (let i = 0; i < Math.max(rows.length, lines.length); i++) {\n    let row = rows[i] || tpl;\n    if (lines[i]) row = row.replace('<\u002Fw:p><\u002Fw:tc>', runXml(lines[i], color || '004C46') + '<\u002Fw:p><\u002Fw:tc>');\n    out.push(row);\n  }\n  const first = inner.indexOf(rows[0]);\n  const lastEnd = inner.lastIndexOf(rows[rows.length - 1]) + rows[rows.length - 1].length;\n  return xml.slice(0, ts) + inner.slice(0, first) + out.join('') + inner.slice(lastEnd) + xml.slice(te);\n}\nconst tick = (xml, i) => (i < 0 ? xml : xml.slice(0, i) + '☒' + xml.slice(i + 1));\n\nclass Component extends DCLogic {\n  state = { cover: true, step: 0, notes: { 1: '', 2: '', 3: '', 4: '', 5: '', 6: '' }, f: {}, busy: '', error: '' };\n  contentRef = React.createRef();\n  coverRef = React.createRef();\n  cornerRef = React.createRef();\n  topRef = React.createRef();\n\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem(KEY) || 'null');\n      if (s) this.setState({ step: Math.min(s.step || 0, LAST), notes: { ...this.state.notes, ...(s.notes || {}) }, f: s.f || {} });\n    } catch (e) {}\n    document.documentElement.lang = 'en-AU';\n    document.title = 'The discovery guide – Walkthrough';\n    requestAnimationFrame(() => this.animateCover());\n  }\n\n  animateCover() {\n    const el = this.coverRef.current;\n    if (!el || !el.animate) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const ease = 'cubic-bezier(.16,1,.3,1)';\n    el.animate([{ transform: 'translateX(-8%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 650, easing: ease });\n    el.querySelectorAll('[data-cover-anim]').forEach((it, i) => it.animate([{ opacity: 0, transform: 'translateY(9px)' }, { opacity: 1, transform: 'none' }], { duration: 550, delay: 160 + i * 70, easing: ease, fill: 'backwards' }));\n    const fold = el.querySelector('[data-fold]');\n    if (fold) fold.animate([{ transform: 'translate(30%,30%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 800, delay: 300, easing: ease, fill: 'backwards' });\n  }\n\n  focusHeading() {\n    const el = this.content();\n    const hd = (el && el.querySelector('h1,h2')) || document.querySelector('main h1, main h2');\n    if (!hd) return;\n    hd.setAttribute('tabindex', '-1');\n    hd.style.outline = 'none';\n    hd.focus({ preventScroll: true });\n  }\n\n  upd(updater) {\n    const prev = this.state.step;\n    this.setState(updater, () => this.after(prev));\n  }\n\n  after(prevStep) {\n    try { localStorage.setItem(KEY, JSON.stringify({ step: this.state.step, notes: this.state.notes, f: this.state.f })); } catch (e) {}\n    if (prevStep === this.state.step) return;\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });\n    requestAnimationFrame(() => {\n      this.animateIn(this.state.step > prevStep ? 1 : -1);\n      this.focusHeading();\n    });\n  }\n\n  content() { return this.contentRef.current || document.querySelector('main > div > div'); }\n\n  animateIn(dir) {\n    const el = this.content();\n    if (!el || !el.animate) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const ease = 'cubic-bezier(.2,.7,.2,1)';\n    el.animate([{ opacity: 0, transform: `translateX(${dir * 32}px)` }, { opacity: 1, transform: 'none' }], { duration: 420, easing: ease });\n    el.querySelectorAll('[data-anim]').forEach((it, i) => {\n      it.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 480, delay: 60 + i * 80, easing: ease, fill: 'backwards' });\n    });\n    const c = this.cornerRef.current;\n    if (c) c.animate([{ transform: 'scale(0.2)', opacity: 0.4 }, { transform: 'scale(1.08)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)' }], { duration: 650, easing: ease });\n  }\n\n  gaps() {\n    const f = this.state.f;\n    if (Array.isArray(f.gaps) && f.gaps.length) return f.gaps;\n    const old = [0, 1, 2, 3].map(i => ({ text: f['gap' + i] || '', kind: f['gapKind' + i] || '' })).filter(g => g.text.trim());\n    return old.length ? old : [{ text: '', kind: '' }];\n  }\n  setGaps(fn) { this.upd(s => ({ f: { ...s.f, gaps: fn(this.gaps().map(g => ({ ...g }))) } })); }\n\n  fieldVal(n, i) {\n    const nt = this.state.notes;\n    const v = nt[n + '_' + i];\n    if (v !== undefined) return v;\n    return i === 0 ? (typeof nt[n] === 'string' ? nt[n] : '') : '';\n  }\n\n  firstInvalid() {\n    const el = this.content();\n    if (!el) return null;\n    const box = Array.from(el.querySelectorAll('textarea, input')).find(t => !t.value.trim());\n    if (box) return box;\n    const rg = Array.from(el.querySelectorAll('[role=\"radiogroup\"]')).find(g => !g.querySelector('[aria-checked=\"true\"]'));\n    if (rg) return rg.querySelector('[role=\"radio\"]');\n    return el.querySelector('[aria-pressed]');\n  }\n\n  prefill(n) { return (this.props['prefill' + n] || PREFILL[n] || '').trim(); }\n  required() { return this.props.requireNotes ?? true; }\n  area() { const s = this.state.step; return s >= 2 && s <= 7 ? AREAS[s - 2] : null; }\n\n  go(d) { this.upd(s => ({ step: Math.max(0, Math.min(LAST, s.step + d)), error: '' })); }\n\n  async buildDocx(filled) {\n    const res = await fetch((window.__resources && window.__resources.guideDocx) || DOCX_URL);\n    if (!res.ok) throw new Error('Could not load the guide template.');\n    const buf = await res.arrayBuffer();\n    if (!filled) return new Blob([buf], { type: DOCX_MIME });\n    const JSZip = window.JSZip || (await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm')).default;\n    const zip = await JSZip.loadAsync(buf);\n    let xml = await zip.file('word/document.xml').async('string');\n    for (const a of AREAS) {\n      const lines = [];\n      this.prefill(a.n).split(/\\n+/).filter(l => l.trim()).forEach((t, i) => lines.push({ t: (i === 0 ? PREFILL_LABEL[a.n] || '' : '') + t, pre: true }));\n      FIELDS[a.n].forEach((lab, i) => { const v = this.fieldVal(a.n, i).trim().replace(/\\n+/g, ' '); if (v) lines.push({ t: lab + ': ' + v, pre: false }); });\n      if (!lines.length) continue;\n      const ai = xml.indexOf('>AREA ' + a.n);\n      if (ai < 0) continue;\n      const ts = xml.indexOf('<w:tbl>', ai);\n      const te = xml.indexOf('<\u002Fw:tbl>', ts);\n      const inner = xml.slice(ts, te);\n      const rows = inner.match(/<w:tr [\\s\\S]*?<\\/w:tr>/g) || [];\n      if (!rows.length) continue;\n      const tpl = rows[rows.length - 1].replace(/ w14:(paraId|textId)=\"[^\"]*\"/g, '');\n      const out = [];\n      for (let i = 0; i < Math.max(rows.length, lines.length); i++) {\n        let row = rows[i] || tpl;\n        const l = lines[i];\n        if (l) {\n          const run = `<w:r><w:rPr><w:rFonts w:ascii=\"Lato\" w:hAnsi=\"Lato\" w:cs=\"Lato\"/><w:color w:val=\"${l.pre ? '4A4A4A' : '004C46'}\"/><w:sz w:val=\"20\"/><\u002Fw:rPr><w:t xml:space=\"preserve\">${esc(l.t.trim())}<\u002Fw:t><\u002Fw:r>`;\n          row = row.replace('<\u002Fw:p><\u002Fw:tc>', run + '<\u002Fw:p><\u002Fw:tc>');\n        }\n        out.push(row);\n      }\n      const first = inner.indexOf(rows[0]);\n      const lastEnd = inner.lastIndexOf(rows[rows.length - 1]) + rows[rows.length - 1].length;\n      const newInner = inner.slice(0, first) + out.join('') + inner.slice(lastEnd);\n      xml = xml.slice(0, ts) + newInner + xml.slice(te);\n    }\n    const f = this.state.f;\n    [['What they’re actually trying', 'heard1'], ['What they have now', 'heard2'], ['What matters most to them', 'heard3'], ['Anything I noticed', 'heard4'],\n     ['What I’ll hand over', 'handover'], ['Agreed with the customer', 'agreed'], ['What would change this plan', 'trigger']]\n      .forEach(([a, k]) => { xml = fillLines(xml, a, 0, f[k]); });\n    NNL.forEach((k, i) => { xml = fillLines(xml, 'When a trigger arrives', i, f[k]); });\n    const gl = this.gaps().filter(g => (g.text || '').trim());\n    for (let i = 0; i < 4; i++) {\n      const g = gl[i];\n      if (!g) break;\n      let text = g.text;\n      if (i === 3 && gl.length > 4) text += '\\n' + gl.slice(4).map(x => x.text.trim().replace(/\\n+/g, ' ') + (x.kind ? ` (${x.kind})` : '')).join('\\n');\n      xml = fillLines(xml, 'Which kind of gap', i, text);\n      const j = GAP_KINDS.indexOf(g.kind);\n      const r = nthTable(xml, 'Which kind of gap', i);\n      if (j >= 0 && r) { let p = r[1]; for (let n = 0; n <= j; n++) p = xml.indexOf('☐', p + 1); xml = tick(xml, p); }\n    }\n    const refTbl = xml.lastIndexOf('<w:tbl>', xml.indexOf('trical Worker'));\n    REFS.forEach(r => {\n      if (!f['ref_' + r.key] || refTbl < 0) return;\n      const idx = xml.indexOf(r.anchor, refTbl);\n      if (idx < 0) return;\n      xml = tick(xml, xml.lastIndexOf('☐', idx));\n      if (r.key === 'other' && (f.refOther || '').trim()) {\n        const d = xml.indexOf('............................', idx);\n        if (d > 0) xml = xml.slice(0, d) + esc(f.refOther.trim()) + xml.slice(d + 28);\n      }\n    });\n    zip.file('word/document.xml', xml);\n    return zip.generateAsync({ type: 'blob', mimeType: DOCX_MIME });\n  }\n\n  async download(filled) {\n    if (this.state.busy) return;\n    this.setState({ busy: filled ? 'filled' : 'blank', error: '' });\n    try {\n      const blob = await this.buildDocx(filled);\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = filled ? 'Discovery guide - completed.docx' : 'Discovery guide - blank.docx';\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 4000);\n      this.setState({ busy: '' });\n    } catch (e) {\n      this.setState({ busy: '', error: 'The download didn’t work. Please try again.' });\n    }\n  }\n\n  renderVals() {\n    const { step, notes, busy, error } = this.state;\n    const area = this.area();\n    const filled = n => FIELDS[n].every((_, i) => this.fieldVal(n, i).trim().length > 0);\n    const tried = this.state.tried === step;\n    const f = this.state.f;\n    const has = k => (f[k] || '').trim().length > 0;\n    const sec = SECTIONS.find(s => s.step === step);\n    const gaps = this.gaps();\n    const gapsOk = gaps.every(g => (g.text || '').trim() && g.kind);\n    const refsPicked = REFS.filter(r => f['ref_' + r.key]);\n    const refsOk = refsPicked.length > 0 && (!f.ref_other || has('refOther')) &&\n      (has('handover') || (refsPicked.length === 1 && f.ref_none));\n    const secOk = {\n      8: ['heard1', 'heard2', 'heard3', 'heard4'].every(has),\n      9: gapsOk,\n      10: refsOk,\n      11: has('agreed'),\n      12: NNL.every(has) && has('trigger')\n    };\n    const hints = {\n      8: 'Fill in all four boxes to continue.',\n      9: 'Fill in each item and mark which kind of gap it is.',\n      10: 'Tick who to involve and add your handover notes.',\n      11: 'Add the agreed next step to continue.',\n      12: 'Fill in every box to continue. “Nothing yet” is a complete answer.'\n    };\n    const doneAt = st => (st >= 2 && st <= 7 ? filled(st - 1) : !!secOk[st]);\n    const mkDot = (st, name, accent) => {\n      const done = doneAt(st), cur = st === step;\n      const state = done ? 'done' : 'not done yet';\n      return {\n        label: `${name}, ${state}${cur ? ', current section' : ''}`, title: name,\n        current: cur ? 'step' : 'false', locked: done || cur ? 'false' : 'true',\n        cursor: done && !cur ? 'pointer' : 'default',\n        bg: done ? accent : '#FFFFFF', border: done || cur ? accent : '#8A847D',\n        ring: cur ? `0 0 0 3px #FFFFFF, 0 0 0 5px ${accent}` : 'none',\n        go: () => { if (done && !cur) this.upd({ step: st, tried: -1 }); }\n      };\n    };\n    const p1 = AREAS.map(a => mkDot(a.n + 1, `Area ${a.n}: ${a.name}`, a.accent));\n    const p2 = SECTIONS.map(s => mkDot(s.step, s.name, s.accent));\n    const n1 = AREAS.filter(a => doneAt(a.n + 1)).length, n2 = SECTIONS.filter(s => doneAt(s.step)).length;\n    const trackerParts = [\n      { name: 'Part 1 · The six areas', countText: `${n1} of 6 done`, dots: p1 },\n      { name: 'Part 2 · After the conversation', countText: `${n2} of 5 done`, dots: p2 }\n    ];\n    const setF = patch => this.upd(s => ({ f: { ...s.f, ...patch } }));\n    const canNext = !this.required() || (area ? filled(area.n) : sec ? secOk[step] : true);\n    const vals = {\n      step,\n      showCover: this.state.cover, notCover: !this.state.cover,\n      coverLabel: step > 0 ? 'Continue' : 'Start',\n      coverRef: this.coverRef,\n      startCover: () => this.setState({ cover: false }, () => { window.scrollTo(0, 0); requestAnimationFrame(() => { this.animateIn(1); this.focusHeading(); }); }),\n      isWelcome: step === 0, isIntro: step === 1, isDone: step === LAST,\n      stepLabel: step === 0 ? '' : step === 1 ? 'Before you start' : step === LAST ? 'Complete' : sec ? sec.name : `Area ${area.n} of 6`,\n      showTracker: step >= 2 && step <= 12, trackerParts,\n      isS1: step === 8, isS2: step === 9, isS3: step === 10, isS4: step === 11, isS5: step === 12,\n      onField: e => { const k = e.target.dataset.field; const v = e.target.value; setF({ [k]: v }); },\n      hintShown: tried && (area || sec) && !canNext ? (area ? 'Fill in every box to continue. If you didn’t find something out, write that down.' : hints[step]) : '',\n      hintText: area ? 'Add your notes to continue.' : sec ? hints[step] : '',\n      gapRows: gaps.map((g, i) => ({\n        idx: i, text: g.text || '',\n        title: gaps.length > 1 ? `What’s missing · ${i + 1}` : 'What’s missing',\n        groupLabel: `Which kind of gap, item ${i + 1}`,\n        canDelete: gaps.length > 1,\n        remove: () => this.setGaps(a => { a.splice(i, 1); return a.length ? a : [{ text: '', kind: '' }]; }),\n        opts: GAP_KINDS.map(label => {\n          const sel = g.kind === label;\n          return { label, checked: sel ? 'true' : 'false', bg: sel ? '#F6E3EF' : '#FFFFFF', border: sel ? '#B43393' : '#8A847D', dot: sel ? '#B43393' : '#FFFFFF',\n            pick: () => this.setGaps(a => { a[i].kind = sel ? '' : label; return a; }) };\n        })\n      })),\n      onGap: e => { const i = +e.target.dataset.gap; const v = e.target.value; this.setGaps(a => { a[i].text = v; return a; }); },\n      addGap: () => this.setGaps(a => a.concat({ text: '', kind: '' })),\n      refList: REFS.map(r => {\n        const on = !!f['ref_' + r.key];\n        return { label: r.label, pressed: on ? 'true' : 'false', bg: on ? '#DDF0FA' : '#FFFFFF', border: on ? '#0071CE' : '#8A847D', box: on ? '#0071CE' : '#FFFFFF', mark: on ? '✓' : '',\n          toggle: () => setF({ ['ref_' + r.key]: !on }) };\n      }),\n      otherOn: !!f.ref_other,\n      refOther: f.refOther || '', handover: f.handover || '', agreed: f.agreed || '', trigger: f.trigger || '',\n      heard1: f.heard1 || '', heard2: f.heard2 || '', heard3: f.heard3 || '', heard4: f.heard4 || '',\n      segs: AREAS.map(a => {\n        const idx = a.n + 1;\n        return { name: a.name, bg: step >= idx || step === LAST ? a.accent : '#E4E1DC' };\n      }),\n      cornerA: area ? area.accent : step === LAST ? '#7CC24D' : step === 1 ? '#00A8E2' : '#00774C',\n      cornerB: area ? area.second : step === LAST ? '#F6B436' : step === 1 ? '#742E89' : '#B8D87A',\n      showBack: step > 0,\n      showNext: step < LAST,\n      canNext, cannotNext: !canNext,\n      showHint: !!(area || sec) && !canNext,\n      nextLabel: step === 0 ? 'Start' : step === 12 ? 'Finish' : 'Next',\n      navBg: area ? area.accent : sec ? sec.accent : '#004C46',\n      navInk: area ? area.ink : sec ? sec.ink : '#FFFFFF',\n      next: () => {\n        if (canNext) { this.setState({ tried: -1 }); this.go(1); return; }\n        this.setState({ tried: step }, () => { const t = this.firstInvalid(); if (t) t.focus(); });\n      },\n      onAreaField: e => { const k = e.target.dataset.key; const v = e.target.value; this.upd(s => ({ notes: { ...s.notes, [k]: v } })); },\n      back: () => this.go(-1),\n      onNote: e => { const n = e.target.dataset.area; const v = e.target.value; this.upd(s => ({ notes: { ...s.notes, [n]: v } })); },\n      summary: AREAS.concat(SECTIONS.map((s, i) => ({ n: '✓', name: s.name, accent: s.accent, ink: s.ink }))),\n      completedLabel: busy === 'filled' ? 'Preparing…' : 'Download completed guide',\n      blankLabel: busy === 'blank' ? 'Preparing…' : 'Download blank copy',\n      downloadCompleted: () => this.download(true),\n      downloadBlank: () => this.download(false),\n      hasError: !!error, errorMsg: error,\n      restart: () => this.upd({ step: 0, notes: {}, f: {}, tried: -1 }),\n      contentRef: this.contentRef, cornerRef: this.cornerRef, topRef: this.topRef\n    };\n    NNL.forEach(k => { vals[k] = f[k] || ''; });\n    AREAS.forEach(a => {\n      const p = this.prefill(a.n);\n      vals['isA' + a.n] = step === a.n + 1;\n      vals['fields' + a.n] = FIELDS[a.n].map((label, i) => {\n        const value = this.fieldVal(a.n, i);\n        const bad = tried && !value.trim();\n        return { label, key: a.n + '_' + i, value, invalid: bad ? 'true' : 'false', border: bad ? '#AB0033' : '#8A847D' };\n      });\n      vals['prefill' + a.n] = p;\n      vals['hasPrefill' + a.n] = !!p;\n      vals['noPrefill' + a.n] = !p;\n    });\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
